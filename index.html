<div id="welcome-screen" class="fixed inset-0 z-[100] bg-white/90 dark:bg-slate-950/90 backdrop-blur-3xl flex flex-col items-center justify-start pt-8 sm:justify-center sm:pt-0 transition-all duration-700 overflow-y-auto py-10 px-4">
    <div class="text-center max-w-4xl w-full my-auto sm:my-auto">
        <div class="mb-6 mt-4 sm:mt-30 animate-float inline-block">
            <div class="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-br from-indigo-500 to-pink-500 rounded-3xl flex items-center justify-center text-white text-4xl shadow-2xl shadow-indigo-500/40 rotate-12 mx-auto">
                <i class="fa-solid fa-martini-glass-citrus -rotate-12"></i>
            </div>
        </div>
        <h1 class="text-3xl sm:text-6xl md:text-8xl font-black mb-3 sm:mb-6 tracking-tighter text-slate-900 dark:text-white">
            Куда пойдем <span class="gradient-text block mt-1 sm:mt-2">в Кишиневе?</span>
        </h1>
        <p class="text-sm sm:text-xl md:text-2xl text-slate-500 dark:text-slate-400 mb-6 sm:mb-12 font-light">Выбери свой вайб на сегодня</p>
        
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 sm:gap-6 mb-8 max-w-3xl mx-auto">
            <!-- 1. Весь город (перемещен наверх) -->
            <button onclick="startApp('all')" class="group relative p-4 sm:p-8 rounded-3xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 hover:-translate-y-2 transition-all duration-300 shadow-2xl hover:shadow-slate-900/40 dark:hover:shadow-white/30 text-left flex flex-col justify-center overflow-hidden col-span-2 md:col-span-1">
                <i class="fa-solid fa-map-location-dot absolute -right-4 -bottom-4 text-6xl sm:text-8xl opacity-10 group-hover:scale-125 transition-transform duration-500"></i>
                <div class="font-black text-lg sm:text-2xl mb-1 flex items-center gap-3">
                    <i class="fa-solid fa-map-location-dot text-xl sm:text-2xl"></i> Весь город
                </div>
                <div class="text-[11px] sm:text-sm opacity-80 mt-1 sm:mt-2 font-medium">Покажите мне всё!</div>
            </button>

            <!-- 2. Центр -->
            <button onclick="startApp('Центр')" class="group relative p-4 sm:p-8 rounded-3xl glass hover:-translate-y-2 transition-all duration-300 hover:shadow-2xl hover:shadow-indigo-500/20 border border-white/50 dark:border-white/10 hover:border-indigo-500 text-left overflow-hidden">
                <i class="fa-solid fa-landmark absolute -right-4 -bottom-4 text-6xl sm:text-8xl text-indigo-500 opacity-5 group-hover:scale-125 transition-transform duration-500"></i>
                <div class="text-2xl sm:text-4xl mb-2 sm:mb-4 text-indigo-500 group-hover:scale-110 transition-transform origin-left drop-shadow-md"><i class="fa-solid fa-landmark"></i></div>
                <div class="font-black text-base sm:text-2xl mb-1 text-slate-800 dark:text-white">Центр</div>
                <div class="text-[11px] sm:text-sm text-slate-500 dark:text-slate-400 font-medium">Сердце города</div>
            </button>

            <!-- 3. Ботаника -->
            <button onclick="startApp('Ботаника')" class="group relative p-4 sm:p-8 rounded-3xl glass hover:-translate-y-2 transition-all duration-300 hover:shadow-2xl hover:shadow-emerald-500/20 border border-white/50 dark:border-white/10 hover:border-emerald-500 text-left overflow-hidden">
                <i class="fa-solid fa-tree-city absolute -right-4 -bottom-4 text-6xl sm:text-8xl text-emerald-500 opacity-5 group-hover:scale-125 transition-transform duration-500"></i>
                <div class="text-2xl sm:text-4xl mb-2 sm:mb-4 text-emerald-500 group-hover:scale-110 transition-transform origin-left drop-shadow-md"><i class="fa-solid fa-tree-city"></i></div>
                <div class="font-black text-base sm:text-2xl mb-1 text-slate-800 dark:text-white">Ботаника</div>
                <div class="text-[11px] sm:text-sm text-slate-500 dark:text-slate-400 font-medium">Парки и уют</div>
            </button>

            <!-- 4. Рышкановка -->
            <button onclick="startApp('Рышкановка')" class="group relative p-4 sm:p-8 rounded-3xl glass hover:-translate-y-2 transition-all duration-300 hover:shadow-2xl hover:shadow-blue-500/20 border border-white/50 dark:border-white/10 hover:border-blue-500 text-left overflow-hidden">
                <i class="fa-solid fa-gem absolute -right-4 -bottom-4 text-6xl sm:text-8xl text-blue-500 opacity-5 group-hover:scale-125 transition-transform duration-500"></i>
                <div class="text-2xl sm:text-4xl mb-2 sm:mb-4 text-blue-500 group-hover:scale-110 transition-transform origin-left drop-shadow-md"><i class="fa-solid fa-gem"></i></div>
                <div class="font-black text-base sm:text-2xl mb-1 text-slate-800 dark:text-white">Рышкановка</div>
                <div class="text-[11px] sm:text-sm text-slate-500 dark:text-slate-400 font-medium">Стиль и жизнь</div>
            </button>

            <!-- 5. Буюканы -->
            <button onclick="startApp('Буюканы')" class="group relative p-4 sm:p-8 rounded-3xl glass hover:-translate-y-2 transition-all duration-300 hover:shadow-2xl hover:shadow-orange-500/20 border border-white/50 dark:border-white/10 hover:border-orange-500 text-left overflow-hidden">
                <i class="fa-solid fa-cloud-sun absolute -right-4 -bottom-4 text-6xl sm:text-8xl text-orange-500 opacity-5 group-hover:scale-125 transition-transform duration-500"></i>
                <div class="text-2xl sm:text-4xl mb-2 sm:mb-4 text-orange-500 group-hover:scale-110 transition-transform origin-left drop-shadow-md"><i class="fa-solid fa-cloud-sun"></i></div>
                <div class="font-black text-base sm:text-2xl mb-1 text-slate-800 dark:text-white">Буюканы</div>
                <div class="text-[11px] sm:text-sm text-slate-500 dark:text-slate-400 font-medium">Закаты и лес</div>
            </button>

            <!-- 6. Чеканы -->
            <button onclick="startApp('Чеканы')" class="group relative p-4 sm:p-8 rounded-3xl glass hover:-translate-y-2 transition-all duration-300 hover:shadow-2xl hover:shadow-purple-500/20 border border-white/50 dark:border-white/10 hover:border-purple-500 text-left overflow-hidden">
                <i class="fa-solid fa-building absolute -right-4 -bottom-4 text-6xl sm:text-8xl text-purple-500 opacity-5 group-hover:scale-125 transition-transform duration-500"></i>
                <div class="text-2xl sm:text-4xl mb-2 sm:mb-4 text-purple-500 group-hover:scale-110 transition-transform origin-left drop-shadow-md"><i class="fa-solid fa-building"></i></div>
                <div class="font-black text-base sm:text-2xl mb-1 text-slate-800 dark:text-white">Чеканы</div>
                <div class="text-[11px] sm:text-sm text-slate-500 dark:text-slate-400 font-medium">Аллеи и бары</div>
            </button>
        </div>
    </div>
</div>
