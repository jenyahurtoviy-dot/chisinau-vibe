<!DOCTYPE html>
<html lang="ru" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chisinau Vibe | Premium Guide</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'blob': 'blob 7s infinite',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glowPulse 2s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px) scale(0.95)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(40px, -60px) scale(1.1)' },
                            '66%': { transform: 'translate(-30px, 30px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        glowPulse: {
                            '0%, 100%': { 
                                boxShadow: '0 0 25px rgba(245, 158, 11, 0.6), 0 0 50px rgba(236, 72, 153, 0.4)',
                                borderColor: 'rgba(245, 158, 11, 0.8)'
                            },
                            '50%': { 
                                boxShadow: '0 0 45px rgba(245, 158, 11, 0.9), 0 0 80px rgba(236, 72, 153, 0.7)',
                                borderColor: 'rgba(236, 72, 153, 1)'
                            }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap');
        
        body { 
            background-color: #f1f5f9;
            transition: background-color 0.5s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .dark body { background-color: #020617; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
        
        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .gradient-text {
            background: linear-gradient(135deg, #6366f1, #d946ef, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: gradientMove 4s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .card-hover:hover {
            box-shadow: 0 20px 40px -5px rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
        }
        .dark .card-hover:hover {
            box-shadow: 0 20px 40px -5px rgba(99, 102, 241, 0.25);
            border-color: rgba(99, 102, 241, 0.4);
        }
        
        .cat-btn-active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-color: transparent !important;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 1.2rem !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15) !important;
            color: #0f172a !important;
        }
        .dark .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            border: 1px solid rgba(255,255,255,0.1);
            color: #f8fafc !important;
        }
        .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.95) !important;
        }
        .dark .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.95) !important;
        }
        
        .leaflet-control-zoom a {
            background-color: var(--tw-bg-opacity, #fff) !important;
            color: #475569 !important;
            border-radius: 8px !important;
            margin-bottom: 4px;
            border: none !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
        }
        .dark .leaflet-control-zoom a {
            background-color: #1e293b !important;
            color: #cbd5e1 !important;
        }

        .user-location-ping {
            position: relative;
            width: 20px;
            height: 20px;
        }
        .user-location-ping::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3b82f6;
            border-radius: 50%;
            animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
            opacity: 0.75;
        }
        .user-location-ping::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; width: 12px; height: 12px;
            background-color: #2563eb;
            border: 2px solid white;
            border-radius: 50%;
        }
    </style>
</head>

        const mapStyleDark = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const isDark = html.classList.contains('dark');
            
            if (isDark) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.textContent = '🌙';
                if (tileLayer) tileLayer.setUrl(mapStyleLight);
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.textContent = '☀️';
                if (tileLayer) tileLayer.setUrl(mapStyleDark);
            }
            if (map) map.invalidateSize();
        }

        // РАНДОМАЙЗЕР ("МНЕ ПОВЕЗЕТ")
        function getRandomPlace() {
            let currentPlaces = places.filter(p => {
                const matchCat = state.category === 'all' || p.type === state.category;
                const matchDist = state.district === 'all' || p.district === state.district;
                return matchCat && matchDist;
            });

            if (currentPlaces.length === 0) currentPlaces = places;

            const random = currentPlaces[Math.floor(Math.random() * currentPlaces.length)];
            
            const modal = document.getElementById('random-modal');
            const content = document.getElementById('modal-content');
            const mapBtn = document.getElementById('modal-map-btn');

            content.innerHTML = `
                <div class="p-4 rounded-2xl bg-gradient-to-br ${random.gradient} text-white flex items-center justify-between">
                    <div>
                        <span class="text-xs font-bold uppercase tracking-widest opacity-80">${random.district}</span>
                        <h4 class="text-2xl font-black">${random.name}</h4>
                    </div>
                    <span class="text-4xl">${random.icon}</span>
                </div>
                <p class="text-sm font-medium opacity-90">${random.desc}</p>
                <div class="bg-indigo-500/10 p-3 rounded-xl border border-indigo-500/20 text-xs">
                    <b>🎯 Развлечения:</b> ${random.entertainment}
                </div>
                <div class="text-xs font-bold text-emerald-500">💰 Средний чек: ${random.priceRange}</div>
            `;
            mapBtn.href = random.mapUrl;

            modal.classList.remove('hidden');
        }

            document.getElementById('random-modal').classList.add('hidden');

        // ГЕОЛОКАЦИЯ ПОЛЬЗОВАТЕЛЯ
        function getUserLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    if (userMarker) map.removeLayer(userMarker);

                    const userIcon = L.divIcon({
                        className: 'user-location-ping',
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    });

                    userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
                    userMarker.bindPopup("<b>Вы находитесь здесь 📍</b>").openPopup();
                    map.setView([lat, lng], 14);
                }, error => {
                    alert("Не удалось получить геопозицию. Убедитесь, что разрешили доступ к местоположению на вашем устройстве.");
                });
            } else {
                alert("Ваш браузер не поддерживает геопозиционирование.");
            }
        }

        function initMap() {
            map = L.map('map', { 
                zoomControl: false,
                dragging: !isMobile(),
                tap: !isMobile()
            }).setView([47.025, 28.832], isMobile() ? 12 : 13);
            
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            const isDark = document.documentElement.classList.contains('dark');
            tileLayer = L.tileLayer(isDark ? mapStyleDark : mapStyleLight, {
                attribution: '© <a href="https://carto.com/">CARTO</a>'
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
            updateMapMarkers(places);

            // Автозапрос местоположения при загрузке карты
            getUserLocation();
        }

        function updateMapMarkers(placesToRender) {
            if (!markersLayer) return;
            markersLayer.clearLayers();

            let bounds = [];

            placesToRender.forEach(p => {
                const iconSize = isMobile() ? [38, 38] : [48, 48];
                const customIcon = L.divIcon({
                    className: 'bg-transparent',
                    html: `
                        <div class="w-9 h-9 sm:w-12 sm:h-12 rounded-full flex items-center justify-center text-lg sm:text-2xl shadow-xl border-2 sm:border-4 border-white dark:border-slate-800 bg-gradient-to-br ${p.gradient} hover:scale-110 transition-transform duration-300">
                            ${p.icon}
                        </div>
                    `,
                    iconSize: iconSize,
                    iconAnchor: [iconSize[0]/2, iconSize[1]/2],
                    popupAnchor: [0, -iconSize[1]/2]
                });

                const marker = L.marker([p.lat, p.lng], { icon: customIcon });
                
                const popupContent = `
                    <div style="font-family: 'Outfit', sans-serif; padding: 2px; min-width: 200px;">
                        <h4 style="font-weight: 900; font-size: 16px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px;">
                            <div class="w-7 h-7 rounded-full bg-gradient-to-br ${p.gradient} flex items-center justify-center text-xs shadow-md" style="color:white; display:flex; align-items:center; justify-content:center;">
                                ${p.icon}
                            </div> 
                            <span style="color: var(--tw-text-opacity, #334155);">${p.name}</span>
                        </h4>
                        <p style="font-size: 12px; color: #64748b; margin-bottom: 6px;"><b>Район:</b> ${p.district}</p>
                        <p style="font-size: 13px; margin-bottom: 6px; line-height: 1.3;">${p.desc}</p>
                        <div style="background: rgba(99, 102, 241, 0.1); padding: 6px 8px; border-radius: 8px; margin-bottom: 6px;">
                            <p style="font-size: 12px; margin: 0; line-height: 1.3;"><b>🎯 Развлечения:</b> ${p.entertainment}</p>
                        </div>
                        <p style="font-size: 12px; font-weight: 800; color: #10b981; margin: 0 0 8px 0; background: rgba(16, 185, 129, 0.1); padding: 4px 8px; border-radius: 6px;">💰 Цены: ${p.priceRange}</p>
                        <a href="${p.mapUrl}" target="_blank" style="display: block; text-align: center; background: #0f172a; color: white; padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; text-decoration: none;">🗺️ Открыть на Google Карте</a>
                    </div>
                `;

                marker.bindPopup(popupContent);
                markersLayer.addLayer(marker);
                bounds.push([p.lat, p.lng]);
            });

            if (bounds.length > 0 && state.district !== 'all') {
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
            } else if (bounds.length > 0 && state.district === 'all') {
                map.setView([47.025, 28.832], isMobile() ? 12 : 13);
            }
        }

        function initOnlineCounter() {
            const el = document.getElementById('online-count');
            let current = Math.floor(Math.random() * 400) + 100;
            el.textContent = current;

            setInterval(() => {
                let diff = Math.floor(Math.random() * 20) - 7;
                current += diff;
                if (current < 120) current = 120;
                if (current > 550) current = 550;
                
                el.style.transform = 'scale(1.3)';
                el.style.color = '#10b981';
                el.textContent = current;
                
                setTimeout(() => {
                    el.style.transform = 'scale(1)';
                    el.style.color = ''; 
                }, 300);
            }, 3500 + Math.random() * 4000);
        }

        function startApp(selectedDistrict) {
            const welcome = document.getElementById('welcome-screen');
            const mainApp = document.getElementById('main-app');

            welcome.style.opacity = '0';
            welcome.style.transform = 'scale(1.05)';
            
            setTimeout(() => {
                welcome.classList.add('hidden');
                mainApp.classList.remove('hidden');
                
                requestAnimationFrame(() => {
                    mainApp.classList.remove('opacity-0', 'translate-y-10');
                    if (!map) {
                        initMap();
                    } else {
                        map.invalidateSize();
                    }
                });
            }, 500);

            setDistrict(selectedDistrict);
            initOnlineCounter();
        }

        function setCategory(cat) {
            state.category = cat;
            
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('cat-btn-active');
                btn.classList.add('bg-white/40', 'dark:bg-slate-800/40', 'text-slate-600', 'dark:text-slate-300');
            });
            const activeBtn = document.getElementById(`btn-cat-${cat}`);
            activeBtn.classList.add('cat-btn-active');
            activeBtn.classList.remove('bg-white/40', 'dark:bg-slate-800/40', 'text-slate-600', 'dark:text-slate-300');
            
            applyFilters();
        }

        function setDistrict(dist) {
            state.district = dist;
            
            const buttons = document.querySelectorAll('.dist-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-indigo-500', 'text-white', 'shadow-lg', 'shadow-indigo-500/30', 'scale-[1.02]');
                btn.classList.add('bg-white/40', 'dark:bg-slate-800/40', 'text-slate-700', 'dark:text-slate-200');
                
                if(btn.textContent.includes(dist === 'all' ? 'Весь город' : dist)) {
                    btn.classList.remove('bg-white/40', 'dark:bg-slate-800/40', 'text-slate-700', 'dark:text-slate-200');
                    btn.classList.add('bg-indigo-500', 'text-white', 'shadow-lg', 'shadow-indigo-500/30', 'scale-[1.02]');
                }
            });

            applyFilters();
        }

        function updateDistrictDisplay() {
            const display = document.getElementById('current-district-display');
            const title = document.getElementById('grid-title');
            
            if(state.district === 'all') {
                display.textContent = '🌍 Весь Кишинев';
                title.textContent = state.category === 'all' ? 'Все заведения' : 'Результаты поиска';
            } else {
                display.textContent = `📍 ${state.district}`;
                title.textContent = `Вайб: ${state.district}`;
            }
        }

        function applyFilters() {
            state.search = document.getElementById('search-input').value.toLowerCase();
            updateDistrictDisplay();

            let filtered = places.filter(p => {
                const matchCat = state.category === 'all' || p.type === state.category;
                const matchDist = state.district === 'all' || p.district === state.district;
                const matchSearch = p.name.toLowerCase().includes(state.search) || 
                                  p.tags.some(t => t.toLowerCase().includes(state.search)) ||
                                  p.desc.toLowerCase().includes(state.search);
                return matchCat && matchDist && matchSearch;
            });

            filtered.sort((a, b) => b.rating - a.rating);

            renderGrid(filtered);
            updateMapMarkers(filtered);
        }

        function renderGrid(placesToRender) {
            const grid = document.getElementById('places-grid');
            const countEl = document.getElementById('places-count');
            
            countEl.style.transform = 'scale(1.3)';
            countEl.textContent = placesToRender.length;
            setTimeout(() => countEl.style.transform = 'scale(1)', 200);

            grid.innerHTML = '';
            
            if(placesToRender.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full glass rounded-2xl sm:rounded-[2rem] p-8 sm:p-16 text-center flex flex-col items-center justify-center border border-dashed border-slate-300 dark:border-slate-700">
                        <div class="text-5xl sm:text-7xl mb-4 opacity-40 animate-pulse">🏜️</div>
                        <h3 class="text-xl sm:text-3xl font-black mb-2">Упс, ничего не найдено</h3>
                        <p class="text-slate-500 text-sm sm:text-lg">Попробуйте изменить фильтры или ввести другой запрос.</p>
                        <button onclick="document.getElementById('search-input').value=''; applyFilters()" class="mt-4 sm:mt-6 px-5 py-2.5 bg-indigo-500 text-white font-bold text-sm sm:text-base rounded-xl shadow-lg hover:bg-indigo-600 transition-colors">Сбросить поиск</button>
                    </div>`;
                return;
            }

            placesToRender.forEach((p, index) => {
                const tagsHtml = p.tags.map(t => `<span class="bg-white/30 dark:bg-black/40 backdrop-blur-md border border-white/40 dark:border-white/10 text-slate-700 dark:text-white text-[9px] sm:text-[10px] uppercase font-bold px-2 py-0.5 rounded-md shadow-sm">${t}</span>`).join('');
                
                const isTopLeader = index === 0 && p.rating >= 4.8;
                const topGlowClass = isTopLeader ? 'animate-glow border-2 border-amber-400 dark:border-amber-400 shadow-[0_0_30px_rgba(245,158,11,0.4)]' : 'border border-white/60 dark:border-white/10';
                
                const topBadge = isTopLeader ? `
                    <div class="absolute -top-3 left-4 sm:left-6 bg-gradient-to-r from-amber-500 to-pink-500 text-white font-black text-[10px] sm:text-xs px-2.5 sm:px-3 py-0.5 sm:py-1 rounded-full shadow-lg z-30 flex items-center gap-1 uppercase tracking-wider">
                        ⭐ Выбор редакции
                    </div>
                ` : '';

                const cardHtml = `
                    <div class="glass rounded-2xl sm:rounded-[2rem] p-4 sm:p-6 relative flex flex-col justify-between card-hover transition-all duration-300 ${topGlowClass}">
                        ${topBadge}
                        <div>
                            <div class="h-28 sm:h-36 rounded-xl sm:rounded-2xl bg-gradient-to-br ${p.gradient} p-4 sm:p-5 flex flex-col justify-between relative overflow-hidden mb-4 sm:mb-5 shadow-inner">
                                <div class="absolute -right-4 -bottom-4 sm:-right-6 sm:-bottom-6 text-6xl sm:text-7xl opacity-20 transform rotate-12">${p.icon}</div>
                                <div class="flex justify-between items-center relative z-10">
                                    <span class="bg-white/20 backdrop-blur-md text-white text-[10px] sm:text-xs font-black px-2.5 sm:px-3 py-0.5 sm:py-1 rounded-full border border-white/20 shadow-sm">${p.district}</span>
                                    <div class="flex items-center gap-1 bg-black/30 backdrop-blur-md text-white text-[10px] sm:text-xs font-bold px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-full shadow-sm">
                                        ⭐ ${p.rating}
                                    </div>
                                </div>
                                <div class="relative z-10 flex flex-wrap gap-1 items-center mt-auto">
                                    ${tagsHtml}
                                </div>
                            </div>

                            <div class="mb-3 sm:mb-4">
                                <div class="flex items-center justify-between mb-1">
                                    <h3 class="text-xl sm:text-2xl font-black tracking-tight text-slate-900 dark:text-white flex items-center gap-1.5 sm:gap-2">
                                        <span>${p.icon}</span> ${p.name}
                                    </h3>
                                    <span class="font-black text-indigo-600 dark:text-indigo-400 text-xs sm:text-sm tracking-wider">${p.price}</span>
                                </div>
                                <p class="text-slate-600 dark:text-slate-300 text-xs sm:text-sm font-medium leading-relaxed">${p.desc}</p>
                            </div>

                            <div class="space-y-1.5 sm:space-y-2 mb-4 sm:mb-6 text-[11px] sm:text-xs font-medium">
                                <div class="bg-indigo-500/10 dark:bg-indigo-900/20 p-2.5 sm:p-3 rounded-xl border border-indigo-500/20">
                                    <span class="font-bold text-indigo-600 dark:text-indigo-400 block mb-0.5">🎯 Развлечения:</span>
                                    <span class="text-slate-600 dark:text-slate-300">${p.entertainment}</span>
                                </div>
                                <div class="bg-emerald-500/10 dark:bg-emerald-900/20 p-2.5 sm:p-3 rounded-xl border border-emerald-500/20 flex items-center justify-between">
                                    <span class="font-bold text-emerald-600 dark:text-emerald-400">💰 Средний чек:</span>
                                    <span class="text-slate-700 dark:text-slate-200 font-bold">${p.priceRange}</span>
                                </div>
                            </div>
                        </div>

                        <div class="pt-3 sm:pt-4 border-t border-slate-200/60 dark:border-slate-800/60 flex items-center gap-3 mt-auto">
                            <a href="${p.mapUrl}" target="_blank" class="flex-1 py-2.5 sm:py-3 px-4 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold text-xs sm:text-sm rounded-xl text-center shadow-md hover:opacity-90 transition-all flex items-center justify-center gap-2 hover:scale-[1.02]">
                                <span>🗺️</span> Google Карты
                            </a>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        window.addEventListener('resize', () => {
            if (map) map.invalidateSize();
        });
    </script>
</body>
</html>
